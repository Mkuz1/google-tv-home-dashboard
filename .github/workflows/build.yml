name: Build

# Builds both APKs (Google TV and car) on every push and pull request. Pushing a tag like v1.2.0, or a new
# versionName reaching main, also publishes a GitHub release with both APKs, signed with the key stored in the repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS) so updates install over earlier versions.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check page scripts
        run: for f in app/assets/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))"; done

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret (e.g. a fork): building with a throwaway key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mk-tv-car-launcher-apks
          path: |
            out/mk-tv-launcher.apk
            out/mk-car-launcher.apk

      # A pushed tag (v2.0.0) publishes that release. A push to main publishes the version in
      # app/AndroidManifest.xml (versionName) once, if there is no release for it yet.
      - name: Release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            TAG="v$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml)"
            gh release view "$TAG" >/dev/null 2>&1 || echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          cp out/mk-tv-launcher.apk "out/mk-tv-launcher-$TAG.apk"
          cp out/mk-car-launcher.apk "out/mk-car-launcher-$TAG.apk"
          SUMS=$(cd out && sha256sum mk-*-launcher-$TAG.apk)
          gh release create "$TAG" "out/mk-tv-launcher-$TAG.apk" "out/mk-car-launcher-$TAG.apk" --target "$GITHUB_SHA" --title "MK TV & Car Launcher ${TAG#v}" --notes "**Google TV / Android TV:** \`mk-tv-launcher-$TAG.apk\` (Android TV 9+). **Car head unit:** \`mk-car-launcher-$TAG.apk\` (Android 8+). Install steps are in the README.

          SHA-256:
          \`\`\`
          $SUMS
          \`\`\`"
