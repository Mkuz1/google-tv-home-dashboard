<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Phone Home</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <!-- Liquid Glass wallpaper: pre-blurred, so nothing is blurred live -->
  <div id="wall"></div>

  <!-- Home pages and, after the last one, the App Library; swiped sideways -->
  <main id="viewport">
    <div id="track"></div>
  </main>

  <!-- Page dots (the last one is the App Library), and the Search pill shown in their place -->
  <div id="dots"></div>
  <button id="searchPill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-t="searchShort"></span></button>

  <!-- Dock -->
  <nav id="dock" class="glass"><div id="dockApps"></div></nav>

  <!-- Edit mode: add a widget, settings, done -->
  <div id="editBar">
    <!-- Like iOS: Edit → Add Widget / Customize; Done -->
    <button class="pill text" id="editBtn" data-t="edit"></button>
    <div class="spacer"></div>
    <button class="pill text" id="doneBtn" data-t="done"></button>
  </div>

  <!-- Search: swipe down on a home page, or tap the Search pill -->
  <div id="spot">
    <div class="sp-bar">
      <label class="sp-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="spInput" type="search" autocomplete="off"></label>
      <button class="sp-cancel" id="spCancel" data-t="cancel"></button>
    </div>
    <div class="sp-scroll" id="spResults"></div>
  </div>

  <!-- The app or widget being dragged floats here, above everything -->
  <div id="dragLayer"></div>

  <!-- Open folder -->
  <div id="folder">
    <!-- The name: tap to rename in edit mode (a new folder opens with it ready to type) -->
    <div class="fd-title" id="fdTitle"><input id="fdName" maxlength="24" autocomplete="off" spellcheck="false" readonly></div>
    <div class="fd-platter glass solid" id="fdPlatter"><div class="fd-grid" id="fdGrid"></div></div>
  </div>

  <!-- Bottom sheets: add widget, settings, Qibla -->
  <div id="sheetScrim"></div>
  <section class="sheet glass solid" id="widgetSheet">
    <div class="grabber"></div>
    <div class="sh-title" data-t="widgets"></div>
    <div class="sh-scroll" id="widgetList"></div>
  </section>
  <section class="sheet glass solid" id="settingsSheet">
    <div class="grabber"></div>
    <div class="sh-title" data-t="settings"></div>
    <div class="sh-scroll" id="settingsList"></div>
  </section>
  <section class="sheet glass solid" id="homeSheet">
    <div class="grabber"></div>
    <div class="hm-logo" id="homeLogo"></div>
    <div class="sh-title" data-t="setHome"></div>
    <div class="hm-sub" data-t="setHomeSub"></div>
    <button class="hm-btn" id="homeSet" data-t="setHomeBtn"></button>
    <button class="hm-later" id="homeLater" data-t="notNow"></button>
  </section>
  <section class="sheet glass solid" id="restoreSheet">
    <div class="grabber"></div>
    <div class="sh-title" data-t="restoreTitle"></div>
    <div class="hm-sub" data-t="restoreSub"></div>
    <button class="hm-btn" id="restoreYes" data-t="restore"></button>
    <button class="hm-later" id="restoreNo" data-t="notNow"></button>
  </section>
  <section class="sheet glass solid" id="qiblaSheet">
    <div class="grabber"></div>
    <div class="sh-title" data-t="qiblaTitle"></div>
    <div class="qb-dial">
      <div id="qbRose">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
          <g stroke="rgba(255,255,255,.45)" stroke-width="2" id="qbTicks"></g>
          <text x="100" y="32" text-anchor="middle" class="qb-n">N</text>
          <g id="qbKaaba"><line x1="100" y1="100" x2="100" y2="24" stroke="#E2BC74" stroke-width="5" stroke-linecap="round"/>
            <rect x="88" y="6" width="24" height="24" rx="3" fill="#1B1407" stroke="#E2BC74" stroke-width="2.5"/>
            <rect x="88" y="12" width="24" height="4" fill="#E2BC74"/></g>
        </svg>
      </div>
      <svg class="qb-phone" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l7 19-7-4-7 4z"/></svg>
    </div>
    <div class="qb-main" id="qbMain"></div>
    <div class="qb-sub" id="qbSub"></div>
  </section>

  <!-- Long-press menu -->
  <div id="scrim"></div>
  <div id="menu" class="glass solid" hidden></div>

  <!-- Silent prayer banner -->
  <div id="alert" class="glass solid" hidden></div>
  <div id="toast" hidden></div>

  <script src="bridge-mock.js"></script>
  <script src="config.js"></script>
  <script src="praytimes.js"></script>
  <script src="azkar.js"></script>
  <script src="islamic.js"></script>
  <script src="dash.js"></script>
  <script src="phone.js"></script>
</body>
</html>
