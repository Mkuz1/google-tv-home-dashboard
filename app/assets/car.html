<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Car Home</title>
  <link rel="stylesheet" href="car.css">
</head>
<body>
  <!-- CarPlay-style wallpaper: a softly blurred nature scene under Liquid Glass -->
  <div id="wall">
    <div id="wallImg"></div>
    <div id="wallShade"></div>
  </div>

  <main id="stage">
    <!-- Dock (left, or bottom on a portrait screen): status, recent apps, Settings, Home/Dashboard -->
    <nav id="dock" class="glass">
      <button class="dk-status" id="dkClock" aria-label="Start screensaver">
        <span id="clock"></span><span id="clockAmpm"></span>
      </button>
      <button class="dk-btn small" id="dkWifi" aria-label="Wi-Fi"></button>
      <div class="dk-rule"></div>
      <div id="dkRecents"></div>
      <div class="dk-spacer"></div>
      <button class="dk-btn small" id="dkSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.21l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.36 7.36 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.21L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.21.37.3.59.21l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.36 7.36 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.21l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <button class="dk-btn view" id="dkView" aria-label="Home or Dashboard"></button>
    </nav>

    <section id="main">
      <!-- Home: pages of app icons, swiped sideways -->
      <div id="apps">
        <div id="viewport"><div id="pages"></div></div>
        <div id="dots"></div>
      </div>

      <!-- Dashboard: time, weather and prayer times -->
      <div id="dash">
        <section class="card glass" id="cClock">
          <div id="dLogo" class="logo"></div>
          <div class="d-time"><span id="dTime">--:--</span><span id="dAmpm"></span></div>
          <div class="d-date" id="dDate"></div>
          <div class="d-hijri" id="dHijri" dir="rtl"></div>
          <div id="dChips"></div>
        </section>
        <section class="card glass" id="cWeather">
          <div class="card-label">Weather</div>
          <div class="w-now">
            <div class="w-icon" id="wIcon"></div>
            <div class="w-temp" id="wTemp">--°</div>
            <div class="w-meta">
              <div class="w-city" id="wCity"></div>
              <div class="w-cond" id="wCond"></div>
              <div class="w-extra" id="wExtra"></div>
            </div>
          </div>
          <div class="w-days" id="wDays"></div>
        </section>
        <section class="card glass" id="cPrayer">
          <header><div class="card-label">Prayer Times</div><div class="pr-next" id="prNext"></div></header>
          <ol id="prList"></ol>
        </section>
      </div>
    </section>

    <!-- Move mode: hint and Done -->
    <div id="moveBar" class="glass" hidden>
      <span>Drag the app, or tap where it should go</span>
      <button id="moveDone">Done</button>
    </div>

    <!-- Open folder: a Liquid Glass platter -->
    <div id="folder">
      <div class="fd-platter glass">
        <div class="fd-title" id="fdTitle"></div>
        <div class="fd-scroll" id="fdScroll"><div class="fd-grid" id="fdGrid"></div></div>
      </div>
    </div>

    <!-- Long-press menu -->
    <div id="scrim"></div>
    <div id="pop" class="glass" hidden>
      <div id="popItems"></div>
      <div class="pop-tail"></div>
    </div>
  </main>

  <script src="bridge-mock.js"></script>
  <script src="config.js"></script>
  <script src="praytimes.js"></script>
  <script src="dash.js"></script>
  <script src="car.js"></script>
</body>
</html>
